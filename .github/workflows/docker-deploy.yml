name: Docker deployment bundle
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Package clean sources
        run: python scripts/package-docker.py artifacts/docker
      - name: Extract and validate deployment bundle
        run: |
          mkdir -p work/docker-smoke
          unzip -q artifacts/docker/*.zip -d work/docker-smoke
          cp work/docker-smoke/.env.example work/docker-smoke/.env
          docker compose -f work/docker-smoke/compose.yaml config --quiet
      - name: Build and start the packaged source
        run: docker compose -f work/docker-smoke/compose.yaml -f work/docker-smoke/compose.build.yaml up -d --build --pull never --wait --wait-timeout 180
      - name: Check version, UI and persisted data
        shell: bash
        run: |
          curl -fsS http://127.0.0.1:9000/api/drive/capabilities | python -c 'import json,sys; from pathlib import Path; assert json.load(sys.stdin)["data"]["version"] == Path("VERSION").read_text().strip()'
          curl -fsS http://127.0.0.1:9000/webgui/ | grep -q 'Folder Sync'
          docker compose -f work/docker-smoke/compose.yaml exec -T folder-sync sh -c 'test -s config/config.yaml && echo persisted > storage/.deploy-check'
          docker compose -f work/docker-smoke/compose.yaml down
          docker compose -f work/docker-smoke/compose.yaml up -d --wait --wait-timeout 180
          test "$(docker compose -f work/docker-smoke/compose.yaml exec -T folder-sync cat storage/.deploy-check)" = persisted
      - name: Logs on failure
        if: failure()
        run: docker compose -f work/docker-smoke/compose.yaml logs --tail=100
      - uses: actions/upload-artifact@v4
        with:
          name: Folder-Sync-Docker-deployment
          path: artifacts/docker/*
          if-no-files-found: error
      - name: Stop isolated deployment
        if: always()
        run: docker compose -f work/docker-smoke/compose.yaml down
