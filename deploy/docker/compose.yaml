name: fast-folder-sync
services:
  folder-sync:
    image: ghcr.io/haoyu-qi/fast-folder-sync-service:${FFS_VERSION:-0.3.0}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    ports:
      - "${FFS_BIND_IP:-0.0.0.0}:${FFS_PORT:-9000}:9000"
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - ./config:/app/config
      - ./storage:/app/storage
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
